name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }

      - name: Verify and package VSIX
        run: npm run package

      - name: Create checksum
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $vsix = "dist\s2p-viewer-$version.vsix"
          if (-not (Test-Path -LiteralPath $vsix)) {
            throw "Missing release artifact: $vsix"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $vsix).Hash.ToLowerInvariant()
          "$hash  s2p-viewer-$version.vsix" | Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          gh release create "${{ github.ref_name }}" `
            --verify-tag `
            --title "S2P Viewer $version" `
            --generate-notes `
            "dist\s2p-viewer-$version.vsix" `
            "dist\SHA256SUMS.txt"
